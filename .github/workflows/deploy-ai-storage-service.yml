name: Deploy · ai-storage-service

on:
  push:
    branches: [main]
    paths:
      - "services/ai-storage-service/**"
      - ".github/workflows/deploy-ai-storage-service.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: services/ai-storage-service

permissions:
  id-token: write   # required for Azure OIDC federated login
  contents: read
  packages: write    # required to push to ghcr.io

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/ai-storage-service

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ai-storage-service/requirements.txt
            services/ai-storage-service/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  deploy:
    name: Build, push & deploy container
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: services/ai-storage-service
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AI_STORAGE_SERVICE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point App Service at the new image
        run: |
          az webapp config container set \
            --name "${{ secrets.AI_STORAGE_SERVICE_AZURE_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --container-image-name "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --container-registry-url https://ghcr.io

      - name: Restart App Service
        run: |
          az webapp restart \
            --name "${{ secrets.AI_STORAGE_SERVICE_AZURE_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}"

      - name: Azure logout
        if: always()
        run: az logout
