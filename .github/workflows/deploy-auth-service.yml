name: Deploy · auth-service

# Runs on every push to main that touches this service. Deploys straight to
# production (no staging slot) — see docs/deployment.md § "Blue/green
# deploys" if you want to swap this for a slot-based rollout later.
on:
  push:
    branches: [main]
    paths:
      - "services/auth-service/**"
      - ".github/workflows/deploy-auth-service.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: services/auth-service

permissions:
  id-token: write   # required for Azure OIDC federated login
  contents: read

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: services/auth-service/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          NODE_ENV: test
          REDIS_URL: redis://localhost:6379

  deploy:
    name: Deploy to Azure App Service
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: services/auth-service/package-lock.json

      # Ship production dependencies only — App Service runs `npm start`
      # directly against this same directory, it doesn't run its own install.
      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AUTH_SERVICE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AUTH_SERVICE_AZURE_APP_NAME }}
          package: services/auth-service

      - name: Azure logout
        if: always()
        run: az logout
