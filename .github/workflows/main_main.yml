# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - main

on:
  push:
    branches:
      - main
    paths:
      - "services/main/**"
      - "services/main-service/**"
      - ".github/workflows/main_main.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        working-directory: services/main
        run: |
          npm ci --omit=dev || npm install
          npm run build --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app-main
          path: services/main

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app-main
          path: services/main

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'main'
          slot-name: 'Production'
          package: services/main
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_BE911E7DC7814A4384E42E22E8E067AB || secrets.AZUREAPPSERVICE_PUBLISHPROFILE_MAIN }}