name: CI · auth-service

on:
  push:
    branches: [main]
    paths:
      - "services/auth-service/**"
      - ".github/workflows/ci-auth-service.yml"
  pull_request:
    paths:
      - "services/auth-service/**"
      - ".github/workflows/ci-auth-service.yml"

defaults:
  run:
    working-directory: services/auth-service

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # rate-limit-redis (via src/config/redis.js, pulled in by src/app.js) opens
    # a real ioredis connection the moment the app module is required — even
    # test/health.test.js's smoke test needs a reachable Redis or it fails
    # with MaxRetriesPerRequestError, so CI provides one the same way a real
    # deployment would.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: services/auth-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          REDIS_URL: redis://localhost:6379
