name: CI · auth-service

on:
  push:
    branches: [main]
    paths:
      - "services/auth-service/**"
      - ".github/workflows/ci-auth-service.yml"

  pull_request:
    paths:
      - "services/auth-service/**"
      - ".github/workflows/ci-auth-service.yml"

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: services/auth-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: services/auth-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          REDIS_URL: redis://localhost:6379